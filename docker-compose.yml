version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # BASE DE DATOS: MySQL 8.0 Oficial
  # ----------------------------------------------------------------------------
  db:
    image: mysql:8.0
    container_name: ferreteria-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-ferreteria_db}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secret_pass}
      MYSQL_USER: ${DB_USER:-ferreteria_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-ferreteria_pass_123}
      TZ: America/Bogota
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/src/main/resources/db/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./backend/src/main/resources/db/02_initial_data.sql:/docker-entrypoint-initdb.d/02_initial_data.sql:ro
    ports:
      - "3306:3306"
    networks:
      - ferreteria-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-root_secret_pass}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # BACKEND: Java 21 / Spring Boot 3
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ferreteria-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-ferreteria_db}
      DB_USER: ${DB_USER:-ferreteria_user}
      DB_PASSWORD: ${DB_PASSWORD:-ferreteria_pass_123}
      PORT: 8080
      CORS_ALLOWED_ORIGINS: "http://localhost:5173,http://localhost:3000,http://localhost:80,http://localhost"
      APP_ADMIN_INITIAL_USERNAME: ${ADMIN_USERNAME:-admin_ferreteria}
      APP_ADMIN_INITIAL_PASSWORD: ${ADMIN_PASSWORD:-Admin123*}
    ports:
      - "8080:8080"
    networks:
      - ferreteria-net

  # ----------------------------------------------------------------------------
  # FRONTEND: React 18 + Vite + Material UI (Servido con Nginx)
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ferreteria-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - ferreteria-net

volumes:
  mysql_data:
    name: ferreteria_mysql_data

networks:
  ferreteria-net:
    name: ferreteria_network
    driver: bridge
