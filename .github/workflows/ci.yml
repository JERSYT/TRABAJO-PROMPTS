name: CI/CD Pipeline - Sistema de Inventario Ferretería

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]

jobs:
  # ----------------------------------------------------------------------------
  # JOB 1: Compilación, Pruebas y Validación del Backend (Java 21 / Spring Boot 3)
  # ----------------------------------------------------------------------------
  backend-ci:
    name: Backend Build & Automated Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del Repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 21 LTS (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Compilar y Ejecutar Pruebas Automatizadas
        working-directory: ./backend
        run: |
          chmod +x mvnw || true
          mvn clean test -B

      - name: Empaquetar Artefacto JAR
        working-directory: ./backend
        run: mvn package -DskipTests -B

      - name: Publicar Reportes de Pruebas de Backend
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-test-reports
          path: backend/target/surefire-reports/
          retention-days: 7

  # ----------------------------------------------------------------------------
  # JOB 2: Instalación, Lint y Build de Producción del Frontend (React / Vite)
  # ----------------------------------------------------------------------------
  frontend-ci:
    name: Frontend Lint & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del Repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar Dependencias Reproducibles
        working-directory: ./frontend
        run: npm ci

      - name: Compilar Bundle de Producción
        working-directory: ./frontend
        run: npm run build

      - name: Publicar Artefacto de Distribución Frontend
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7

  # ----------------------------------------------------------------------------
  # JOB 3: Validación de Seguridad y Despliegue de Demostración ($0 COP)
  # ----------------------------------------------------------------------------
  deploy-demo:
    name: Publicación Automática de Demostración
    needs: [backend-ci, frontend-ci]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout del Repositorio
        uses: actions/checkout@v4

      - name: Confirmación de Criterios de Despliegue
        run: |
          echo "Todas las suites de prueba de backend y builds de frontend pasaron con éxito."
          echo "El sistema está verificado y listo para el webhook de despliegue en PaaS gratuito."
